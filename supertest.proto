syntax = "proto3";

package com.google.example.service.v1;

import "google/protobuf/timestamp.proto";

service UserService {
  rpc FetchUserDetails(FetchUserDetailsRequest) returns (UserDetails);
  rpc RemoveUserAccount(RemoveUserAccountRequest) returns (Empty);
}

message FetchUserDetailsRequest {
  string userId = 1;
}

message UserDetails {
  string userId = 1;
  string fullName = 2;
  google.protobuf.Timestamp lastUpdated = 3;
}

message RemoveUserAccountRequest {
  string accountId = 1;
}

message Empty {}
